
general.import = [
	"~/.config/alacritty/catppuccin-macchiato.toml"
]

[window.padding]
	x = 10
	y = 10

[font]
	size = 12.0

[font.bold]
	family = "JetBrains Mono"
	style = "Bold"

[font.bold_italic]
	family = "Iosevka"
	style = "Bold Italic"

[font.italic]
	family = "Iosevka"
	style = "Italic"

[font.normal]
	family = "JetBrains Mono"
	style = "Regular"
